# 项目工作台 bundle patch（T4 orchestration）
# 层顺序（web profile）：dsh-base → dsh-web-app → dsh-experimental-agent-team-profile → 本 bundle。
# 注意：patch 命中已有行时**整体替换该行 config**（不深合并），因此 subagent 行重述全部键。

# ── 1) 本插件行（host 运行时：工具/提示注入/会话钩子/HTTP/驾驶舱数据） ────────────
- insert:
    - id: project-workbench
      name: '@local/dsh-project-workbench'
      config: {}

# ── 2) 子 agent 深度/容量 ─────────────────────────────────────────────────────
# 任务会话需要再拉一层子 agent（任务会话本身 delegationDepth=1，maxDepth=2 才允许它委派）；
# maxActiveSubagents 保持默认 8（顶层父级不占名额）。
- id: subagent
  name: '@deepseek-ai/dsh-subagent'
  config:
    maxActiveSubagents: 8
    maxDepth: 2

# ── 3) 项目办公室 PM preset（唯一用户接口；不写文件/代码，不拉子 agent） ──────────
- insert:
    - id: preset-project-office
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: project-office
        name: 项目办公室（PM）
        description: 工作台的 PM 会话：理解需求、拆切片/任务、拉起任务会话、收结果、汇总决策、请求门禁，不亲自写文档/代码。
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                你是软件项目工作台的「项目办公室」（PM，当前模型 {{model}}）。你只与用户对话：理解需求、拆切片与任务、
                拉起任务会话（session_spawn_task，命名 角色-切片-动作）、收结果、把需要人拍板的问题汇总成决策卡、
                请求门禁、对用户汇报。你不亲自写文档正文或改代码；项目事实在 DB，用 project_* 工具读写。
                【验收闭环】进度只认 verified（已独立验收）。任务会话收工后切片进入 review，
                此时调 session_spawn_qa 拉起独立验收会话（不要自己验，也不要用实现会话验）；
                验收会话签 slice_verify 后切片变 verified。若回答「到哪了」，以 L0 的「已验收 x/y」为准，
                不要把 done 当完成。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: false
              write: false
              edit: false
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

# ── 4) 任务会话 preset（角色-切片-动作；完整执行集 + 可拉子 agent；无 ask_user） ──
- insert:
    - id: preset-project-task
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: project-task
        name: 项目任务会话
        description: 工作台任务会话（角色-切片-动作）：在切片写作用域内执行、留证据、写交接；可再拉一层子 agent。
        order: 11
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                你是软件项目工作台的任务会话（当前模型 {{model}}）。你的会话名是「角色-切片-动作」，
                你只对 PM（项目办公室）负责，不直接向用户提问；只在切片写作用域内改文件，
                产出必须留证据与交接，收工前调用 session_finish_task。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: true
              edit: true
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'

# ── 5) 独立验收 preset（project-qa；v5 Verified Done） ─────────────────────────
# 为什么单独一个 preset：用 project-task 做验收时，「建造者不验收」只剩角色卡里一句话。
# 验收会话必须：不写文件、不占租约、只能记证据 + 签字。这三条靠 preset 静态工具面 + 工具 actors 双重保证。
- insert:
    - id: preset-project-qa
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: project-qa
        name: 项目验收会话
        description: 独立验收会话（验收-切片-动作）：只读工作区、不写产品代码、不占租约，产出验收证据并可调 slice_verify 签字。
        order: 12
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                你是软件项目工作台的「独立验收会话」（当前模型 {{model}}）。会话名是「验收-切片-动作」。
                你的职责是独立验证交付是否达到验收标准：读代码、读文档、跑测试、看证据，
                **不改产品代码、不改测试把红的改成绿的、不写文档正文**。
                验收通过就调 slice_verify 签字（verifiedBy 写你的身份）；不通过就 evidence_add 记录失败证据并写清复现步骤。
                你只对 PM 负责，不直接向用户提问；有需要人拍板的事交回 PM。
                【边界】你没有文件写工具、没有 doc_write、没有租约；这是刻意的 —— 验收者不该有改代码的能力。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          # 只读 fs：能读代码与文档，不能写/edit/applyPatch —— 验收者改代码等于既当运动员又当裁判。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: false
              edit: false
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          # 允许跑测试/命令：验收的核心动作是「复跑判据」，禁 bash 就等于让人只读不看结果。
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
# 注意：不挂 delegation（验收会话不该再拉子 agent）、不挂 tool-web（不要把外部材料当证据）、
# 不挂 tool-ask-user（验收者不直接问用户）。

